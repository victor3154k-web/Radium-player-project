name: Radium Player APK Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. pegar código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node (22 por causa do Capacitor)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. instalar deps
      - name: Install dependencies
        run: npm install

      # 4. build Vite
      - name: Build Vite app
        run: npm run build

      # 5. instalar Capacitor no CI
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli

      # 6. sync Android
      - name: Sync Capacitor
        run: npx cap sync android

      # 7. 🔥 FORÇAR JAVA 17 (CORREÇÃO PRINCIPAL)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 8. garantir permissão Gradle
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 9. build APK
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      # 10. salvar APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadiumPlayer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
